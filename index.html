<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marie's Sketch</title>
    <style>
        body {
            background-color: #f3eff8; /* 부드러운 연보라 배경 */
            color: #4a3b5c; /* 다크 퍼블릭 계열 텍스트 */
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #6b4d88;
            margin-bottom: 5px;
        }

        p {
            color: #8c73a9;
            font-size: 1.1rem;
        }

        /* 슬라이드 갤러리 박스 */
        .slider-container {
            position: relative;
            width: 80%;
            max-width: 600px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(107, 77, 136, 0.15);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 90%;
            max-height: 80%;
            object-fit: cover;
            border-radius: 10px;
        }

        .slide-caption {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #6b4d88;
        }

        /* 이전, 다음 버튼 */
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #d8cce8;
            color: #4a3b5c;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #bfa8db;
            color: white;
        }

        .prev { left: 15px; }
        .next { right: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Marie's Sketch</h1>
        <p>인상 깊은 순간들을 기록하는 공간</p>
    </header>

    <div class="slider-container">
        <!-- 첫 번째 사진 (원하는 이미지 주소나 파일명으로 변경 가능) -->
        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" alt="사진1">
            <div class="slide-caption">첫 번째 스케치 기록</div>
        </div>
        <!-- 두 번째 사진 -->
        <div class="slide">
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop" alt="사진2">
            <div class="slide-caption">두 번째 스케치 기록</div>
        </div>
        <!-- 세 번째 사진 -->
        <div class="slide">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop" alt="사진3">
            <div class="slide-caption">세 번째 스케치 기록</div>
        </div>

        <button class="btn prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="btn next" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }
    </script>

</body>
</html>
